name: autonomic-crown

on:
  pull_request:
    paths:
      - 'autonomic/**'
      - 'fixtures/autonomic/**'
      - 'scripts/autonomic_finish.py'
      - 'scripts/verify_autonomic_finish.py'
      - 'scripts/run_autonomic_crown.py'
      - 'tickets/GL-AUTO-001.md'
      - 'evidence/autonomic/**'
      - '.github/workflows/autonomic-crown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run autonomic crown
        run: python3 scripts/run_autonomic_crown.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: gl-auto-001-evidence
          path: evidence/autonomic/GL-AUTO-001.json
          if-no-files-found: error
