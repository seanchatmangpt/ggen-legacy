name: Cleanup migration diagnostics

on:
  push:
    branches: [agent/migrate-ggen-v26-8-1-corpus]
    paths:
      - .github/workflows/cleanup-migration-diagnostics.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-ggen-v26-8-1-corpus
          fetch-depth: 0
      - name: Remove diagnostic-only surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration-debug
          rm -f .github/workflows/expose-migration-verifier.yml
          rm -f .github/workflows/observe-temporary-import.yml
          rm -f .github/workflows/cleanup-migration-diagnostics.yml
          git config user.name 'ggen migration cleanup agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(migration): remove diagnostic-only surfaces'
          git push origin HEAD:agent/migrate-ggen-v26-8-1-corpus
