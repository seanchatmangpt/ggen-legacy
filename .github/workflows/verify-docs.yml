name: Verify ggen-legacy v26.8.1 assurance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-legacy-v26.8.1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact source coordinate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -s AGENTS.md
          test -s ggen.toml
          test -s ontology/assurance-program.ttl
          test -s authority/assurance-subsystems.json
          test -s authority/document-evidence.json
          test -s authority/foundry-work-program.json
          test -s authority/offline-verifier-transport.json
          test -s foundry/bootstrap.yaml
          test -s scripts/verify_foundry-provenance.py
          test -s scripts/verify-foundry-bootstrap.py
          test -s scripts/verify-offline-transport.py
          test -s packs/ggen-legacy-assurance-pack/pack.toml

      - name: Verify documentary, projection, foundry, receiving, and transport authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_docs.py --strict
          python3 scripts/verify_foundry_provenance.py
          python3 scripts/verify_foundry_bootstrap.py
          python3 scripts/verify_offline_transport.py

      - name: Execute customer-controlled assurance and read-only crown
        shell: bash
        run: |
          set -euo pipefail
          bash appliance/bin/run-reference-e2e.sh
          python3 - <<'PY'
          import json
          crown=json.load(open("evidence/appliance/crown-report.json"))
          assert crown["standing"] == "ALIVE", crown
          assert crown["release_admitted"] is True, crown
          assert crown["sunset_admitted"] is False, crown
          PY

      - name: Manufacture deterministic offline verifier transport twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ggen-legacy-offline-a /tmp/ggen-legacy-offline-b /tmp/ggen-legacy-offline-extract
          bash appliance/bin/build-offline-bundle.sh /tmp/ggen-legacy-offline-a
          bash appliance/bin/build-offline-bundle.sh /tmp/ggen-legacy-offline-b
          cmp \
            /tmp/ggen-legacy-offline-a/ggen-legacy-verifier-v26.8.1.tar.gz \
            /tmp/ggen-legacy-offline-b/ggen-legacy-verifier-v26.8.1.tar.gz
          cmp \
            /tmp/ggen-legacy-offline-a/ggen-legacy-verifier-v26.8.1.tar.gz.sha256 \
            /tmp/ggen-legacy-offline-b/ggen-legacy-verifier-v26.8.1.tar.gz.sha256
          cmp \
            /tmp/ggen-legacy-offline-a/ggen-legacy-verifier-v26.8.1.receipt.json \
            /tmp/ggen-legacy-offline-b/ggen-legacy-verifier-v26.8.1.receipt.json
          mkdir -p /tmp/ggen-legacy-offline-extract
          tar -xzf /tmp/ggen-legacy-offline-a/ggen-legacy-verifier-v26.8.1.tar.gz \
            -C /tmp/ggen-legacy-offline-extract
          bash /tmp/ggen-legacy-offline-extract/ggen-legacy-verifier-v26.8.1/verify-manifest.sh

      - name: Check out exact ggen manufacturing coordinate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: 0f39227c102e0ac7519f0f27561356227a518653
          path: .ggen-tool
          fetch-depth: 1

      - name: Check out exact foundry runtime candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: 458f0f88aee0060cddce3ffdaa7e2172a4f40a25
          path: .foundry-runtime
          fetch-depth: 1

      - name: Provision ggen sibling coordinates
        shell: bash
        run: |
          set -euo pipefail
          repos=(lsp-max lsp-types-max wasm4pm wasm4pm-compat)
          shas=(7bcc1e16dec71ef5fb2cedea2dfd6cb5cde37f59 6773e6017ca83c565785d0ec39d75304f62c3237 0bb134b29245517ac4969a9f1916f5432931c5d0 e46155e209a750fda0218532d96ae17a9e10903e)
          for i in "${!repos[@]}"; do
            git init -q "${repos[$i]}"
            git -C "${repos[$i]}" remote add origin "https://github.com/seanchatmangpt/${repos[$i]}"
            git -C "${repos[$i]}" fetch -q --depth 1 origin "${shas[$i]}"
            git -C "${repos[$i]}" checkout -q FETCH_HEAD
          done

      - name: Install pinned ggen toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22

      - name: Install sccache
        uses: taiki-e/install-action@81ecf985428d5c2ea81dbf079bceca32bc9604ab
        with:
          tool: sccache

      - name: Verify exact foundry runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_HEAD=458f0f88aee0060cddce3ffdaa7e2172a4f40a25
          test "$(git -C .foundry-runtime rev-parse HEAD)" = "$RUNTIME_HEAD"
          test -z "$(git -C .foundry-runtime status --porcelain)"
          RUNTIME_COPY="$(mktemp -d)"
          cp -a .foundry-runtime/. "$RUNTIME_COPY/"
          cargo fmt \
            --manifest-path "$RUNTIME_COPY/tools/architecture-foundry/Cargo.toml" \
            --check
          echo RUNTIME_FMT_OK
          cargo test \
            --manifest-path "$RUNTIME_COPY/tools/architecture-foundry/Cargo.toml" \
            --all-targets
          echo RUNTIME_TESTS_OK
          cargo run \
            --quiet \
            --manifest-path "$RUNTIME_COPY/tools/architecture-foundry/Cargo.toml" \
            -- validate-program \
            --program "$RUNTIME_COPY/docs/architecture-foundry/work-program.yaml"
          echo RUNTIME_VALIDATE_OK
          rm -rf "$RUNTIME_COPY"
          STATUS="$(git -C .foundry-runtime status --porcelain)"
          if [ -n "$STATUS" ]; then
            printf '%s\n' "$STATUS"
            if [ "$STATUS" = "?? tools/architecture-foundry/Cargo.lock" ]; then
              rm -f .foundry-runtime/tools/architecture-foundry/Cargo.lock
            else
              echo RUNTIME_SOURCE_DRIFT_REFUSED >&2
              exit 1
            fi
          fi
          test -z "$(git -C .foundry-runtime status --porcelain)"
          mkdir -p evidence
          python3 - <<'PY'
          import json
          report={
            "schema":"ggen.legacy.foundry.runtime.candidate.receipt.v1",
            "exact_head":"458f0f88aee0060cddce3ffdaa7e2172a4f40a25",
            "upstream_workflow_run":30678718944,
            "manifest":"tools/architecture-foundry/Cargo.toml",
            "real_boundary_suite":"tools/architecture-foundry/tests/real_git.rs",
            "execution_mode":"isolated exact-source copy",
            "ephemeral_generated_paths":["tools/architecture-foundry/Cargo.lock"],
            "commands":["cargo fmt --check","cargo test --all-targets","validate-program"],
            "source_clean_before":True,
            "source_clean_after":True,
            "runtime_dependency_admitted":False,
            "standing":"ALIVE",
            "nonclaims":["production dependency admitted","complete A-K foundry ALIVE"]
          }
          open("evidence/foundry-runtime-candidate.json","w").write(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY
          echo RUNTIME_RECEIPT_WRITTEN

      - name: Build exact ggen CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path .ggen-tool/Cargo.toml -p ggen-cli-lib --bin ggen
          .ggen-tool/target/debug/ggen --version

      - name: Manufacture and replay appliance projections with ggen
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$GITHUB_WORKSPACE/.ggen-tool/target/debug/ggen"
          "$GGEN" sync run
          git diff --exit-code -- appliance
          find appliance -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/appliance-a.sha256
          "$GGEN" sync run
          git diff --exit-code -- appliance
          find appliance -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/appliance-b.sha256
          cmp /tmp/appliance-a.sha256 /tmp/appliance-b.sha256
          python3 scripts/verify_docs.py --strict
          python3 scripts/verify_foundry_provenance.py
          python3 scripts/verify_foundry_bootstrap.py
          python3 scripts/verify_offline_transport.py
          bash appliance/bin/run-reference-e2e.sh

      - name: Install pinned mdBook
        shell: bash
        run: |
          set -euo pipefail
          cargo install mdbook --version 0.4.40 --locked
          mdbook --version

      - name: Build mdBook projection
        shell: bash
        run: |
          set -euo pipefail
          mdbook build docs
          test -s docs/book/index.html
          test -s docs/book/print.html

      - name: Assert authority remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . \
            ':(exclude)evidence/local-docs-verifier.json' \
            ':(exclude)evidence/foundry-provenance-verifier.json' \
            ':(exclude)evidence/foundry-bootstrap-verifier.json' \
            ':(exclude)evidence/foundry-runtime-candidate.json' \
            ':(exclude)evidence/offline-transport-provenance.json' \
            ':(exclude)evidence/appliance/**' \
            ':(exclude)docs/book/**'
          test -s evidence/local-docs-verifier.json
          test -s evidence/foundry-provenance-verifier.json
          test -s evidence/foundry-bootstrap-verifier.json
          test -s evidence/foundry-runtime-candidate.json
          test -s evidence/offline-transport-provenance.json
          test -s evidence/appliance/subsystem-verifier-report.json
          test -s evidence/appliance/subsystem-coverage.json
          test -s evidence/appliance/crown-report.json

      - name: Upload exact-head assurance evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ggen-legacy-v26.8.1-assurance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/local-docs-verifier.json
            evidence/foundry-provenance-verifier.json
            evidence/foundry-bootstrap-verifier.json
            evidence/foundry-runtime-candidate.json
            evidence/offline-transport-provenance.json
            evidence/appliance/*.json
            /tmp/appliance-a.sha256
            /tmp/appliance-b.sha256
            /tmp/ggen-legacy-offline-a/*
          if-no-files-found: error
          retention-days: 30
