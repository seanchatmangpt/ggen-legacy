name: Greenfield DfCM Chicago court

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/v26.8.29/chicago_greenfield.py"
      - "tools/v26.8.29/test_chicago_greenfield.py"
      - "fixtures/chicago-greenfield/**"
      - "tickets/GL-DFCM-CHICAGO-001.md"
      - ".github/workflows/chicago-greenfield-dfcm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greenfield-dfcm-chicago-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chicago:
    name: DfCM → PPDDL → planner → BRCE → receipt → replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact subject identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'REFUSED[STALE_SHA]'; exit 2; }
          echo "SUBJECT_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
      - name: Run greenfield Chicago falsifiers
        run: python3 tools/v26.8.29/test_chicago_greenfield.py -v
      - name: Execute clean manufacture and replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/reconstitution/chicago-greenfield
          python3 tools/v26.8.29/chicago_greenfield.py \
            --scenario fixtures/chicago-greenfield/fortune5-p2p.json \
            --subject-sha "$SUBJECT_SHA" \
            --receipt-out evidence/reconstitution/chicago-greenfield/receipt-a.json \
            | tee evidence/reconstitution/chicago-greenfield/run-a.json
          python3 tools/v26.8.29/chicago_greenfield.py \
            --scenario fixtures/chicago-greenfield/fortune5-p2p.json \
            --subject-sha "$SUBJECT_SHA" \
            --receipt-out evidence/reconstitution/chicago-greenfield/receipt-b.json \
            | tee evidence/reconstitution/chicago-greenfield/run-b.json
          cmp evidence/reconstitution/chicago-greenfield/run-a.json evidence/reconstitution/chicago-greenfield/run-b.json
          cmp evidence/reconstitution/chicago-greenfield/receipt-a.json evidence/reconstitution/chicago-greenfield/receipt-b.json
          grep -q '"replay": "MATCHED"' evidence/reconstitution/chicago-greenfield/run-a.json
          grep -q 'UNSUPPORTED\[ECOSYSTEM_CONTAINER_AMD64\]' evidence/reconstitution/chicago-greenfield/run-a.json
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: greenfield-dfcm-chicago-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/reconstitution/chicago-greenfield/
          if-no-files-found: error
          retention-days: 14
