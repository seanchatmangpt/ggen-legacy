name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-subject reconstitution, planning, contract and LSP runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact head and one-workflow topology
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          test "$count" -eq 1
          printf 'subject_sha=%s workflow_count=%s\n' "$EXPECTED_SHA" "$count"
      - name: Compile autonomous reconstitution court
        run: python3 -m py_compile scripts/reconstitute_fortune5.py scripts/verify_fortune5_reconstitution.py
      - name: Manufacture Fortune 5 self-reconstitution matrix
        run: python3 scripts/reconstitute_fortune5.py --root . --output evidence/reconstitution/current --strict
      - name: Independently replay and mutate Fortune 5 self-reconstitution
        run: python3 scripts/verify_fortune5_reconstitution.py --root .
      - name: Verify combinatorial-max planning subsystem
        run: |
          python3 -m unittest discover -s planning/v26.8.7/tests -v
          python3 planning/v26.8.7/verify.py --strict --output evidence/ci/gl-plan-002.json
          planning/v26.8.7/skdecide_classical_engine.py --help | head -n 1 | grep '^skdecide-classical-engine/26.8.7$'
      - name: Verify received generated contract
        run: python3 scripts/verify_lsp_contract.py
      - name: Install repository-pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test all targets including real stdio LSP boundary
        run: cargo test --all-targets --locked
      - name: Re-run real process boundary explicitly
        run: cargo test --locked --test lsp_boundary -- --nocapture
      - name: Emit verification receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/ci
          cat > evidence/ci/receipt.json <<JSON
          {"repository":"${GITHUB_REPOSITORY}","subject_sha":"${SUBJECT_SHA}","workflow":"${GITHUB_WORKFLOW}","run_id":"${GITHUB_RUN_ID}","standing":"PARTIAL_ALIVE","workflow_count":1,"claim_ceiling":"EXACT_HEAD_LOCAL_AND_REFERENCE_BOUNDARIES_ONLY","boundaries":["fortune5-self-reconstitution","errc-work-queue","reconstitution-replay","reconstitution-negative-controls","gl-plan-002","generated-contract","rust","real-lsp-stdio","malformed-input-refusal"]}
          JSON
          cat evidence/ci/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-head-reconstitution-receipt-${{ github.run_id }}
          path: |
            evidence/ci/receipt.json
            evidence/ci/gl-plan-002.json
            evidence/reconstitution/current/
          if-no-files-found: error
          retention-days: 14
