name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-subject contract and LSP runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact head and one-workflow topology
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          expected="ci.yml
          planning-v26-8-7.yml"
          actual="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -exec basename {} \; | sort)"
          test "$actual" = "$(echo "$expected" | sort)"
          count="$(echo "$actual" | wc -l | tr -d ' ')"
          printf 'subject_sha=%s workflow_count=%s\n' "$EXPECTED_SHA" "$count"
      - name: Verify received generated contract
        run: python3 scripts/verify_lsp_contract.py
      - name: Install repository-pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test all targets including real stdio LSP boundary
        run: cargo test --all-targets --locked
      - name: Re-run real process boundary explicitly
        run: cargo test --locked --test lsp_boundary -- --nocapture
      - name: Emit verification receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/ci
          cat > evidence/ci/receipt.json <<JSON
          {"repository":"${GITHUB_REPOSITORY}","subject_sha":"${SUBJECT_SHA}","workflow":"${GITHUB_WORKFLOW}","run_id":"${GITHUB_RUN_ID}","standing":"ALIVE","workflow_count":2,"boundaries":["generated-contract","rust","real-lsp-stdio","malformed-input-refusal"]}
          JSON
          cat evidence/ci/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}
          path: evidence/ci/receipt.json
          if-no-files-found: error
          retention-days: 14

  bounded-planning-replay:
    name: GL-PLAN-002 planning v26.8.7 replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit only when planning/v26.8.7 inputs changed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$head"^)"
          fi
          if git diff --name-only "$base" "$head" -- \
               'planning/v26.8.7/**' 'tickets/GL-PLAN-002.md' \
               '.github/workflows/ci.yml' 'AGENTS.md' 'justfile' \
             | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify combinatorial-max planning subsystem
        if: steps.gate.outputs.relevant == 'true'
        run: python3 planning/v26.8.7/verify.py --strict --output /tmp/gl-plan-002-report.json
      - name: Stable scikit-decide process witness
        if: steps.gate.outputs.relevant == 'true'
        run: planning/v26.8.7/skdecide_classical_engine.py --help | head -n 1 | grep '^skdecide-classical-engine/26.8.7$'

  dsrust-reconstitution:
    name: GL-DSPY-001 exact dsrust reconstitution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSRUST_SHA: f24adde08c1d8850e4d7079d019643bb40f905cb
      RUSTUP_TOOLCHAIN: nightly-2026-06-22
    steps:
      - name: Checkout exact ggen-legacy subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact ggen-legacy checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Unit-test external reconstitution refusals and replay
        run: python3 tools/v26.8.1/test_external_reconstitution.py
      - name: Checkout frozen dsrust specimen
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/dsrust
          ref: f24adde08c1d8850e4d7079d019643bb40f905cb
          path: _subjects/dsrust
          persist-credentials: false
      - name: Verify exact specimen identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _subjects/dsrust rev-parse HEAD)" = "$DSRUST_SHA"
          test -z "$(git -C _subjects/dsrust status --porcelain=v1 --untracked-files=no)"
      - name: Install known-good dsrust verifier toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - name: Verify selected Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          rustup show active-toolchain | grep '^nightly-2026-06-22-'
      - name: Execute frozen legacy workspace baseline
        working-directory: _subjects/dsrust
        run: cargo test --workspace --all-targets --locked
      - name: Manufacture deterministic observation evidence twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence/reconstitution/dsrust
          python3 tools/v26.8.1/external_reconstitution.py \
            --source _subjects/dsrust \
            --contract reconstitution/dsrust/source-contract.json \
            --out evidence/reconstitution/dsrust/run1
          python3 tools/v26.8.1/external_reconstitution.py \
            --source _subjects/dsrust \
            --contract reconstitution/dsrust/source-contract.json \
            --out evidence/reconstitution/dsrust/run2
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('evidence/reconstitution/dsrust/run1/reconstitution-receipt.json').read_text())
          b = json.loads(Path('evidence/reconstitution/dsrust/run2/reconstitution-receipt.json').read_text())
          assert a['receipt_sha256'] == b['receipt_sha256'], (a['receipt_sha256'], b['receipt_sha256'])
          assert a['artifacts_sha256'] == b['artifacts_sha256']
          assert a['source']['exact_sha'] == 'f24adde08c1d8850e4d7079d019643bb40f905cb'
          assert a['standing'] == 'ALIVE'
          print(json.dumps({
              'case_id': a['case_id'],
              'source_sha': a['source']['exact_sha'],
              'tracked_file_count': a['observed']['tracked_file_count'],
              'rust_surface_count': a['observed']['rust_surface_count'],
              'receipt_sha256': a['receipt_sha256'],
              'standing': a['standing'],
          }, sort_keys=True))
          PY
      - name: Upload exact-subject reconstitution evidence
        uses: actions/upload-artifact@v4
        with:
          name: gl-dspy-001-dsrust-${{ github.run_id }}
          path: evidence/reconstitution/dsrust/
          if-no-files-found: error
          retention-days: 14

  docs-pack-reconstitution:
    name: GL-DOCS-001 real ggen manufacture replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GGEN_SHA: 59c95cac18d49c62533918c906524be0fc4063ec
      RUSTUP_TOOLCHAIN: nightly-2026-06-22
      RUSTC_WRAPPER: ""
      PACK: packs/ggen-docs-reconstitution-pack
    steps:
      - name: Checkout exact ggen-legacy subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact subject and pack source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f "$PACK/ontology.ttl"
          test -f "$PACK/ggen.toml"
          test ! -e "$PACK/consumer/docs/SUMMARY.md"
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          test "$count" -eq 1
      - name: Checkout frozen real ggen manufacturer
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: 59c95cac18d49c62533918c906524be0fc4063ec
          path: _tooling/ggen
          persist-credentials: false
      - name: Verify manufacturer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _tooling/ggen rev-parse HEAD)" = "$GGEN_SHA"
          test -z "$(git -C _tooling/ggen status --porcelain=v1 --untracked-files=no)"
      - name: Install pinned ggen toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - name: Build admitted ggen CLI
        working-directory: _tooling/ggen
        run: cargo build --locked -p ggen-cli-lib --bin ggen
      - name: Dry-run admission and refusal falsifier
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$GITHUB_WORKSPACE/_tooling/ggen/target/debug/ggen"
          cp -a "$PACK" /tmp/docs-pack-admitted
          (cd /tmp/docs-pack-admitted && "$GGEN" sync run --dry-run)
          cp -a "$PACK" /tmp/docs-pack-refused
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/docs-pack-refused/ontology.ttl')
          s = p.read_text()
          old = 'gdoc:outputPath "consumer/docs/00-governance.md"'
          new = 'gdoc:outputPath "../escaped.md"'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          if (cd /tmp/docs-pack-refused && "$GGEN" sync run --dry-run); then
            echo 'REFUSAL_FAILED: invalid output path was admitted' >&2
            exit 1
          fi
      - name: Manufacture twice and prove byte-stable projection
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$GITHUB_WORKSPACE/_tooling/ggen/target/debug/ggen"
          rm -rf /tmp/docs-pack-run1 /tmp/docs-pack-run2 evidence/reconstitution/docs-pack
          cp -a "$PACK" /tmp/docs-pack-run1
          cp -a "$PACK" /tmp/docs-pack-run2
          (cd /tmp/docs-pack-run1 && "$GGEN" sync run)
          (cd /tmp/docs-pack-run2 && "$GGEN" sync run)
          test -f /tmp/docs-pack-run1/consumer/docs/SUMMARY.md
          test -f /tmp/docs-pack-run1/consumer/docs/EVIDENCE.ttl
          diff -ru /tmp/docs-pack-run1/consumer /tmp/docs-pack-run2/consumer
          mkdir -p evidence/reconstitution/docs-pack
          cp -a /tmp/docs-pack-run1/consumer evidence/reconstitution/docs-pack/consumer
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/docs-pack-run1/consumer')
          rows = []
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel = p.relative_to(root).as_posix()
              rows.append((rel, hashlib.sha256(p.read_bytes()).hexdigest()))
          assert len(rows) == 14, rows
          digest = hashlib.sha256(json.dumps(rows, separators=(',', ':'), sort_keys=True).encode()).hexdigest()
          receipt = {
              'case_id': 'GL-DOCS-001',
              'ggen_sha': '59c95cac18d49c62533918c906524be0fc4063ec',
              'artifact_count': len(rows),
              'projection_sha256': digest,
              'standing': 'ALIVE',
              'authority_ceiling': 'GENERATED',
          }
          out = Path('evidence/reconstitution/docs-pack/replay-receipt.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY
      - name: Upload manufacture and replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: gl-docs-001-${{ github.run_id }}
          path: evidence/reconstitution/docs-pack/
          if-no-files-found: error
          retention-days: 14

  ash-paas-manufacture:
    name: GL-PAAS-001 Ash/AshR2RML/Reactor runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GGEN_SHA: 1e9fcb9679a61460fbd641415cb72511c7e50b33
      ASH_R2RML_SHA: 067954ad406fd637fd47646bdb10c4580809c79d
      RUSTUP_TOOLCHAIN: nightly-2026-06-22
      RUSTC_WRAPPER: ""
      PACK: packs/ggen-ash-paas-pack
    steps:
      - name: Checkout exact ggen-legacy subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact subject and source-pack closure
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          test "$count" -eq 1
          python3 "$PACK/gates/verify_pack.py"
          test ! -e "$PACK/consumer/paas/mix.exs"
      - name: Checkout exact canonical ggen manufacturer
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: 1e9fcb9679a61460fbd641415cb72511c7e50b33
          path: _tooling/ggen
          persist-credentials: false
      - name: Verify manufacturer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _tooling/ggen rev-parse HEAD)" = "$GGEN_SHA"
          test -z "$(git -C _tooling/ggen status --porcelain=v1 --untracked-files=no)"
      - name: Install pinned ggen toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - name: Build exact ggen CLI
        working-directory: _tooling/ggen
        run: cargo build --locked -p ggen-cli-lib --bin ggen
      - name: Execute admission and BRCE falsifier
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$GITHUB_WORKSPACE/_tooling/ggen/target/debug/ggen"
          rm -rf /tmp/paas-admitted /tmp/paas-refused
          cp -a "$PACK" /tmp/paas-admitted
          (cd /tmp/paas-admitted && "$GGEN" sync run --dry-run)
          cp -a "$PACK" /tmp/paas-refused
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/paas-refused/ontology.ttl')
          s = p.read_text()
          old = 'paas:brceRequired true'
          new = 'paas:brceRequired false'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          if (cd /tmp/paas-refused && "$GGEN" sync run --dry-run); then
            echo 'REFUSAL_FAILED: graph without mandatory BRCE was admitted' >&2
            exit 1
          fi
      - name: Manufacture twice and prove deterministic projection
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$GITHUB_WORKSPACE/_tooling/ggen/target/debug/ggen"
          rm -rf /tmp/paas-run1 /tmp/paas-run2 evidence/reconstitution/ash-paas
          cp -a "$PACK" /tmp/paas-run1
          cp -a "$PACK" /tmp/paas-run2
          (cd /tmp/paas-run1 && "$GGEN" sync run)
          (cd /tmp/paas-run2 && "$GGEN" sync run)
          diff -ru /tmp/paas-run1/consumer /tmp/paas-run2/consumer
          mapfile -t generated < <(find /tmp/paas-run1/consumer/paas -type f | sort)
          test "${#generated[@]}" -eq 3
          test -f /tmp/paas-run1/consumer/paas/mix.exs
          test -f /tmp/paas-run1/consumer/paas/lib/ggen_legacy_paas.ex
          test -f /tmp/paas-run1/consumer/paas/test/ggen_legacy_paas_test.exs
      - name: Install admitted BEAM runtime
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.1'
          elixir-version: '1.17.3'
      - name: Execute exact generated Ash PaaS subject
        working-directory: /tmp/paas-run1/consumer/paas
        shell: bash
        env:
          MIX_ENV: test
        run: |
          set -euo pipefail
          mix deps.get
          test "$(git -C deps/ash_r2rml rev-parse HEAD)" = "$ASH_R2RML_SHA"
          mix compile --warnings-as-errors
          mix test --trace
      - name: Emit digest-bound runtime receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/reconstitution/ash-paas
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('/tmp/paas-run1/consumer/paas')
          rows = []
          for p in sorted(x for x in root.rglob('*') if x.is_file() and '_build' not in x.parts and 'deps' not in x.parts):
              rel = p.relative_to(root).as_posix()
              rows.append((rel, hashlib.sha256(p.read_bytes()).hexdigest()))
          assert [r[0] for r in rows] == ['lib/ggen_legacy_paas.ex', 'mix.exs', 'test/ggen_legacy_paas_test.exs'], rows
          digest = hashlib.sha256(json.dumps(rows, separators=(',', ':')).encode()).hexdigest()
          receipt = {
              'case_id': 'GL-PAAS-001',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'subject_sha': os.environ['SUBJECT_SHA'],
              'ggen_sha': os.environ['GGEN_SHA'],
              'ash_r2rml_sha': os.environ['ASH_R2RML_SHA'],
              'projection_sha256': digest,
              'generated_artifact_count': len(rows),
              'standing': 'ALIVE',
              'scope': 'generated-provider-neutral-paas-kernel',
              'external_provider_actuation': False,
              'boundaries': [
                  'ggen-admission-refusal',
                  'deterministic-manufacture',
                  'ash-resource-closure',
                  'ash-r2rml-semantic-projection',
                  'reactor-semantic-pipeline',
                  'brce-bound-receipt',
                  'unbound-receipt-refusal',
              ],
          }
          out = Path('evidence/reconstitution/ash-paas/replay-receipt.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY
      - name: Upload PaaS manufacture and runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: gl-paas-001-${{ github.run_id }}
          path: evidence/reconstitution/ash-paas/
          if-no-files-found: error
          retention-days: 14
