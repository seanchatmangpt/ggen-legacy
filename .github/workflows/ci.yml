name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-subject contract and LSP runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact head and one-workflow topology
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          test "$count" -eq 1
          printf 'subject_sha=%s workflow_count=%s\n' "$EXPECTED_SHA" "$count"
      - name: Verify received generated contract
        run: python3 scripts/verify_lsp_contract.py
      - name: Install repository-pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test all targets including real stdio LSP boundary
        run: cargo test --all-targets --locked
      - name: Re-run real process boundary explicitly
        run: cargo test --locked --test lsp_boundary -- --nocapture
      - name: Emit verification receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/ci
          cat > evidence/ci/receipt.json <<JSON
          {"repository":"${GITHUB_REPOSITORY}","subject_sha":"${SUBJECT_SHA}","workflow":"${GITHUB_WORKFLOW}","run_id":"${GITHUB_RUN_ID}","standing":"ALIVE","workflow_count":1,"boundaries":["generated-contract","rust","real-lsp-stdio","malformed-input-refusal"]}
          JSON
          cat evidence/ci/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}
          path: evidence/ci/receipt.json
          if-no-files-found: error
          retention-days: 14

  bounded-planning-replay:
    name: GL-PLAN-002 planning v26.8.7 replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit only when planning/v26.8.7 inputs changed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$head"^)"
          fi
          if git diff --name-only "$base" "$head" -- \
               'planning/v26.8.7/**' 'tickets/GL-PLAN-002.md' \
               '.github/workflows/ci.yml' 'AGENTS.md' 'justfile' \
             | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify combinatorial-max planning subsystem
        if: steps.gate.outputs.relevant == 'true'
        run: python3 planning/v26.8.7/verify.py --strict --output /tmp/gl-plan-002-report.json
      - name: Stable scikit-decide process witness
        if: steps.gate.outputs.relevant == 'true'
        run: planning/v26.8.7/skdecide_classical_engine.py --help | head -n 1 | grep '^skdecide-classical-engine/26.8.7$'

  gl_dspy_001_dsrust_reconstitution:
    name: GL-DSPY-001 dsrust reconstitution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact ggen-legacy subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact ggen-legacy checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Checkout exact dsrust source
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/dsrust
          ref: f24adde74c1a72417a19ebbd9678f5cf73fae22c
          path: dsrust-subject
          persist-credentials: false

      - name: Install dsrust nightly toolchain
        run: |
          rustup toolchain install nightly-2026-06-22 --profile minimal
          rustup component add --toolchain nightly-2026-06-22-x86_64-unknown-linux-gnu rustfmt clippy

      - name: Execute exact dsrust workspace tests
        working-directory: dsrust-subject
        run: |
          cargo +nightly-2026-06-22 test --workspace --all-targets --locked

      - name: Observe exact dsrust subject twice
        run: |
          python3 tools/v26.8.1/external_reconstitution.py observe \
            --source-dir dsrust-subject \
            --contract reconstitution/dsrust/source-contract.json \
            --output dsrust-observe-a
          python3 tools/v26.8.1/external_reconstitution.py observe \
            --source-dir dsrust-subject \
            --contract reconstitution/dsrust/source-contract.json \
            --output dsrust-observe-b

      - name: Verify deterministic observation and baseline receipt
        run: |
          diff -ru dsrust-observe-a dsrust-observe-b
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("reconstitution/dsrust/source-contract.json").read_text())
          report = json.loads(Path("dsrust-observe-a/observation-report.json").read_text())
          receipt = json.loads(Path("dsrust-observe-a/execution-receipt.json").read_text())
          assert report["source_sha"] == contract["source_sha"]
          assert report["repository"] == contract["repository"]
          assert report["dependency_manifest_refs"] == contract["dependency_manifest_refs"]
          assert report["dependency_manifest_refs"] == [
              "Cargo.lock",
              "justfile",
              "rust-toolchain.toml",
              "rustfmt.toml",
          ]
          assert report["executed"]["workspace_test_status"] == 0
          assert len(report["tracked_files"]) == 280
          assert all(item["status"] == 0 for item in report["file_observations"])
          assert len(report["surface_observations"]) >= 800
          assert report["initial_state"]["summary"]["tracked_files"] == 280
          assert receipt["status"] == "ALIVE"
          assert len(receipt["command_sha256"]) == 64
          PY

      - name: Upload dsrust observation receipts
        uses: actions/upload-artifact@v4
        with:
          name: gl-dspy-001-dsrust-observation-receipts
          path: |
            dsrust-observe-a
            dsrust-observe-b
          if-no-files-found: error
          retention-days: 30
