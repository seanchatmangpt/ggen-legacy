name: Expose reconstructed migration verifier

on:
  push:
    branches: [agent/migrate-ggen-v26-8-1-corpus]
    paths:
      - .github/workflows/expose-migration-verifier.yml

permissions:
  contents: write

concurrency:
  group: expose-ggen-v26-8-1-verifier
  cancel-in-progress: true

jobs:
  expose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-ggen-v26-8-1-corpus
          fetch-depth: 0
      - name: Reconstruct and publish diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .migration-debug
          cat .migration-bootstrap/verify/chunk-* | base64 --decode > .migration-debug/verify_ggen_v26_8_1_migration.py
          python3 .migration-bootstrap/patch_verifier.py .migration-debug/verify_ggen_v26_8_1_migration.py
          python3 -m py_compile .migration-debug/verify_ggen_v26_8_1_migration.py
          sha256sum .migration-debug/verify_ggen_v26_8_1_migration.py > .migration-debug/verify_ggen_v26_8_1_migration.py.sha256
          git config user.name 'ggen migration diagnostic agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .migration-debug
          git commit -m 'chore(migration): expose reconstructed verifier for diagnosis'
          git push origin HEAD:agent/migrate-ggen-v26-8-1-corpus
