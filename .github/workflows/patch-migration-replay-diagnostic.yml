name: Patch migration replay diagnostic

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-ggen-v26-8-1-corpus
          fetch-depth: 0
      - name: Add bounded replay diff diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temporary-import-ggen-v26-8-1.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          cmp /tmp/report-a.json migrations/ggen-v26.8.1/verifier-report.json
          cmp /tmp/equivalence-a.json migrations/ggen-v26.8.1/equivalence-report.json
'''
          new = '''          if ! cmp /tmp/report-a.json migrations/ggen-v26.8.1/verifier-report.json; then
            echo '--- report A lines 116-126 ---'
            nl -ba /tmp/report-a.json | sed -n '116,126p'
            echo '--- report B lines 116-126 ---'
            nl -ba migrations/ggen-v26.8.1/verifier-report.json | sed -n '116,126p'
            exit 1
          fi
          cmp /tmp/equivalence-a.json migrations/ggen-v26.8.1/equivalence-report.json
'''
          if text.count(old) != 1:
              raise SystemExit(f'PATCH_PRECONDITION_REFUSED count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/patch-migration-replay-diagnostic.yml
          rm -f .migration-bootstrap/trigger-replay-diff
          git config user.name 'ggen migration diagnostic agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(migration): expose bounded replay report difference'
          git push origin HEAD:agent/migrate-ggen-v26-8-1-corpus
