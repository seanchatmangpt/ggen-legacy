name: Verify ggen v26.8.1 corpus migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-v26.8.1-migration-e0fb965aaf0bf8bf57721a4fde8caa50153f84e2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e0fb965aaf0bf8bf57721a4fde8caa50153f84e2
          fetch-depth: 0
      - name: Checkout exact ggen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: 8351af4c5bbbf60bd99ab8417752a1762c6ea4e3
          path: .source-ggen
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt
      - name: Install verifier dependencies
        run: python3 -m pip install --disable-pip-version-check blake3==1.0.9 jsonschema==4.26.0 pyshacl==0.40.0
      - name: Verify receiving lineage, execution, falsifiers, and replay
        run: python3 scripts/verify_ggen_v26_8_1_migration.py --source-root .source-ggen
      - name: Upload bounded evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ggen-v26.8.1-migration-e0fb965aaf0bf8bf57721a4fde8caa50153f84e2
          path: |
            migrations/ggen-v26.8.1/migration-manifest.json
            migrations/ggen-v26.8.1/equivalence-report.json
            migrations/ggen-v26.8.1/verifier-report.json
            migrations/ggen-v26.8.1/migration-receipt.json
          if-no-files-found: error
