name: Verify ggen v26.8.1 corpus migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ggen-v26.8.1-migration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout exact ggen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: 8351af4c5bbbf60bd99ab8417752a1762c6ea4e3
          path: .source-ggen
          fetch-depth: 0
      - name: Restore ignored source-tracked receipt inputs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source_dir=.source-ggen/packs/legacy-equivalence-verifier-pack/.ggen-v2
          destination_dir=packs/legacy-equivalence-verifier-pack/.ggen-v2
          mkdir -p "$destination_dir"
          cp "$source_dir/receipt-log.jsonl" "$destination_dir/receipt-log.jsonl"
          cp "$source_dir/receipt.json" "$destination_dir/receipt.json"
          test "$(git hash-object "$destination_dir/receipt-log.jsonl")" = 5d332fd5c32f0747f75744e38495831bcfc82bdd
          test "$(git hash-object "$destination_dir/receipt.json")" = 39bb367482201ad6a1bc5759cc60e78bc9613aaf
          git add -f "$destination_dir/receipt-log.jsonl" "$destination_dir/receipt.json"
          if ! git diff --cached --quiet; then
            git config user.name 'ggen migration agent'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(corpus): retain ignored source receipt evidence'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt
      - name: Install verifier dependencies
        run: python3 -m pip install --disable-pip-version-check blake3==1.0.9 jsonschema==4.26.0 pyshacl==0.40.0
      - name: Verify receiving lineage, execution, falsifiers, and replay
        run: python3 scripts/verify_ggen_v26_8_1_migration.py --source-root .source-ggen
      - name: Upload bounded evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ggen-v26.8.1-migration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            migrations/ggen-v26.8.1/migration-manifest.json
            migrations/ggen-v26.8.1/equivalence-report.json
            migrations/ggen-v26.8.1/verifier-report.json
            migrations/ggen-v26.8.1/migration-receipt.json
          if-no-files-found: error
