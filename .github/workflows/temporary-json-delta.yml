name: Temporary enumerate verifier JSON outputs

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-ggen-v26-8-1-corpus
          fetch-depth: 0

      - name: Add bounded JSON-output delta probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.migration-bootstrap/patch_importer.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'report_sinks = [\n'
          insertion = r'''json_before_needle = '        data_counts = parse_data_files(destination_root)\n'
          json_before_replacement = ''' + '"""' + r'''        json_paths_before = {
            candidate.relative_to(destination_root).as_posix()
            for candidate in destination_root.rglob("*.json")
            if ".git" not in candidate.parts and ".source-ggen" not in candidate.parts
        }
        data_counts = parse_data_files(destination_root)
''' + '"""' + r'''
          before_count = verifier_text.count(json_before_needle)
          if before_count != 1:
              raise SystemExit(f'JSON_DELTA_BEFORE_PRECONDITION_REFUSED count={before_count}')
          verifier_text = verifier_text.replace(json_before_needle, json_before_replacement, 1)

          json_after_needle = '        controls = negative_controls(destination_root, source_root, manifest)\n'
          json_after_replacement = json_after_needle + ''' + '"""' + r'''        json_paths_after = {
            candidate.relative_to(destination_root).as_posix()
            for candidate in destination_root.rglob("*.json")
            if ".git" not in candidate.parts and ".source-ggen" not in candidate.parts
        }
        os.write(
            2,
            (
                "JSON_OUTPUT_DELTA="
                + json.dumps(sorted(json_paths_after - json_paths_before))
                + "\\n"
            ).encode(),
        )
''' + '"""' + r'''
          after_count = verifier_text.count(json_after_needle)
          if after_count != 1:
              raise SystemExit(f'JSON_DELTA_AFTER_PRECONDITION_REFUSED count={after_count}')
          verifier_text = verifier_text.replace(json_after_needle, json_after_replacement, 1)

'''
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'JSON_DELTA_PATCH_PRECONDITION_REFUSED count={count}')
          path.write_text(text.replace(anchor, insertion + anchor, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-json-delta.yml
          git config user.name 'ggen migration agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .migration-bootstrap/patch_importer.py .github/workflows/temporary-json-delta.yml
          git commit -m 'test(replay): enumerate verifier-generated JSON outputs'
          git push origin HEAD:agent/migrate-ggen-v26-8-1-corpus
