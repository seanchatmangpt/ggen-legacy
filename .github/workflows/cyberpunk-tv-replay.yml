name: Cyberpunk TV Independent Replay

on:
  pull_request:
    paths:
      - 'packs/cyberpunk-tv-platform-replay/**'
      - 'tickets/TV-001-cyberpunk-platform-source-admission.md'
      - '.github/workflows/cyberpunk-tv-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberpunk-tv-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 1780c205a72a1ee0e8be02f3eb500ee00b5ecea2
  SOURCE_PACK: source-ggen/packs/cyberpunk-tv-platform
  GGEN_BIN: source-ggen/target/debug/ggen

jobs:
  independent-source-and-runtime:
    name: Exact source, polyglot Chicago TDD, receipt, replay
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout receiving repository exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: legacy, fetch-depth: 0 }
      - name: Checkout admitted source exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: 1780c205a72a1ee0e8be02f3eb500ee00b5ecea2
          path: source-ggen
          fetch-depth: 0
      - name: Orient exact subjects and toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/evidence/cyberpunk-tv
          git -C legacy rev-parse HEAD | tee /tmp/legacy-sha.txt
          git -C source-ggen rev-parse HEAD | tee /tmp/source-sha.txt
          test "$(git -C source-ggen rev-parse HEAD)" = "$SOURCE_SHA"
          bash --version | head -1
          python3 --version
          node --version
          sudo apt-get update && sudo apt-get install -y b3sum
          rustup toolchain install nightly-2026-06-22 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup override set nightly-2026-06-22 --path source-ggen
      - name: Verify exact source authority and capability ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 legacy/packs/cyberpunk-tv-platform-replay/verify_source.py --source "$SOURCE_PACK" --contract legacy/packs/cyberpunk-tv-platform-replay/receiving-contract.json --ledger legacy/packs/cyberpunk-tv-platform-replay/capability-ledger.json --output legacy/evidence/cyberpunk-tv/source-verification.json
      - name: Install pinned wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-pack >/dev/null 2>&1 || [ "$(wasm-pack --version)" != "wasm-pack 0.13.1" ]; then cargo +nightly-2026-06-22 install wasm-pack --version 0.13.1 --locked; fi
      - name: Build exact source ggen
        working-directory: source-ggen
        run: cargo +nightly-2026-06-22 build -p ggen-cli-lib --bin ggen
      - name: Manufacture exact source twice
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_PACK"
          rm -rf generated .ggen
          "$GITHUB_WORKSPACE/$GGEN_BIN" sync
          find generated -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/legacy/evidence/cyberpunk-tv/manufacture-first.sha256"
          "$GITHUB_WORKSPACE/$GGEN_BIN" sync
          find generated -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/legacy/evidence/cyberpunk-tv/manufacture-second.sha256"
          cmp "$GITHUB_WORKSPACE/legacy/evidence/cyberpunk-tv/manufacture-first.sha256" "$GITHUB_WORKSPACE/legacy/evidence/cyberpunk-tv/manufacture-second.sha256"
      - name: Install exact generated closure
        working-directory: source-ggen/packs/cyberpunk-tv-platform/generated
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Execute generated Rust WASM JavaScript and browser boundary
        working-directory: source-ggen/packs/cyberpunk-tv-platform/generated
        run: npm run check | tee "$GITHUB_WORKSPACE/legacy/evidence/cyberpunk-tv/runtime-execution.log"
      - name: Execute Python Bash RDF SHACL SPARQL N3 Datalog crown
        shell: bash
        run: bash "$SOURCE_PACK/verify/polyglot_validate.sh" "$SOURCE_PACK/generated"
      - name: Reissue and replay receipt after all evidence
        working-directory: source-ggen/packs/cyberpunk-tv-platform/generated
        run: npm run verify && npm run replay
      - name: Independently classify all evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('source-ggen/packs/cyberpunk-tv-platform/generated')
          receipt = json.loads((base/'.ggen/receipts/cyberpunk-tv.json').read_text())
          chicago = json.loads((base/'.ggen/evidence/chicago-tdd.json').read_text())
          python = json.loads((base/'.ggen/evidence/polyglot-python.json').read_text())
          shell = json.loads((base/'.ggen/evidence/polyglot-shell.json').read_text())
          plan = json.loads((base/'.ggen/plans/combinatorial.json').read_text())
          assert chicago['failed'] == 0
          assert chicago['enumeratedProfiles'] == plan['lawfulProfileUpperBound'] == 8640
          assert chicago['mutationControlsKilled'] == 2
          assert python['failed'] == 0
          assert shell['standing'] == 'PARTIAL_ALIVE'
          report = {
            'schema':'ggen-legacy.cyberpunk-tv.independent-verifier.v4',
            'source_head':'1780c205a72a1ee0e8be02f3eb500ee00b5ecea2',
            'languages_executed':['rust','wasm','javascript','python','bash','sparql','n3','datalog','rdf','shacl'],
            'lawful_profiles_exhaustively_tested':8640,
            'mutation_controls_killed':2,
            'receipt_root':receipt['root'],
            'artifact_count':len(receipt['artifacts']),
            'replay':'REPLAY_MATCH',
            'aggregate_standing':'PARTIAL_ALIVE',
            'release_admission':False,
            'sunset_admission':False,
          }
          target=Path('legacy/evidence/cyberpunk-tv/independent-verifier-report.json')
          target.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report))
          PY
      - name: Publish independent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyberpunk-tv-independent-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/legacy-sha.txt
            /tmp/source-sha.txt
            legacy/evidence/cyberpunk-tv/
            source-ggen/packs/cyberpunk-tv-platform/generated/.ggen/receipts/
            source-ggen/packs/cyberpunk-tv-platform/generated/.ggen/evidence/
            source-ggen/packs/cyberpunk-tv-platform/generated/.ggen/plans/
            source-ggen/packs/cyberpunk-tv-platform/generated/dist/
