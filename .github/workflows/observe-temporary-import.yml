name: Observe temporary ggen corpus import

on:
  push:
    branches: [agent/migrate-ggen-v26-8-1-corpus]
    paths:
      - .migration-bootstrap/trigger-observe-import

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Await exact push run and publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          OBSERVER_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ['REPOSITORY']
          head_sha = os.environ['HEAD_SHA']
          token = os.environ['GH_TOKEN']
          observer_run = int(os.environ['OBSERVER_RUN_ID'])
          workflow_id = 324819459
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ggen-migration-observer',
          }

          def request(url, *, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  raw = response.read()
              return json.loads(raw) if raw else {}

          runs_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}/runs?event=push&per_page=50'
          target = None
          for _ in range(180):
              runs = request(runs_url).get('workflow_runs', [])
              target = next(
                  (
                      run for run in runs
                      if run.get('head_sha') == head_sha
                      and int(run.get('id', 0)) != observer_run
                  ),
                  None,
              )
              if target is not None:
                  break
              time.sleep(5)
          if target is None:
              body = f'OBSERVE_IMPORT_REFUSED head={head_sha} reason=RUN_NOT_FOUND'
          else:
              run_id = int(target['id'])
              for _ in range(360):
                  target = request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
                  if target.get('status') == 'completed':
                      break
                  time.sleep(5)
              jobs = request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
              job_lines = []
              for job in jobs:
                  failed_steps = [
                      step.get('name') for step in job.get('steps', [])
                      if step.get('conclusion') not in (None, 'success', 'skipped')
                  ]
                  job_lines.append(
                      f"- job={job.get('name')} status={job.get('status')} conclusion={job.get('conclusion')} failed_steps={failed_steps}"
                  )
              body = '\n'.join([
                  '## Push-only import observation',
                  '',
                  f'- head: `{head_sha}`',
                  f'- run: `{run_id}`',
                  f"- status: `{target.get('status')}`",
                  f"- conclusion: `{target.get('conclusion')}`",
                  f"- attempt: `{target.get('run_attempt')}`",
                  '',
                  *job_lines,
              ])
          request(
              f'https://api.github.com/repos/{repo}/issues/8/comments',
              method='POST',
              payload={'body': body},
          )
          print(body)
          PY
