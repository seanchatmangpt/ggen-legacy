name: Temporary pin migration Cargo toolchain

on:
  push:
    branches: [agent/migrate-ggen-v26-8-1-corpus]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-ggen-v26-8-1-corpus
          fetch-depth: 0

      - name: Patch bootstrap and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.migration-bootstrap/patch_verifier.py')
          text = path.read_text()
          old = (
              '        "        command_env[\\"RUST_TEST_THREADS\\"] = \\"1\\"\\n"\n'
              '        "    result = subprocess.run(\\n"\n'
          )
          new = (
              '        "        command_env[\\"RUST_TEST_THREADS\\"] = \\"1\\"\\n"\n'
              '        "        command_env[\\"RUSTUP_TOOLCHAIN\\"] = \\"nightly-2026-06-22\\"\\n"\n'
              '        "        command_env[\\"RUSTUP_NO_UPDATE_CHECK\\"] = \\"1\\"\\n"\n'
              '        "    result = subprocess.run(\\n"\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'PINNED_RUSTUP_PATCH_PRECONDITION_REFUSED count={count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/temporary-pin-rustup.yml
          git config user.name 'ggen migration agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .migration-bootstrap/patch_verifier.py .github/workflows/temporary-pin-rustup.yml
          git commit -m 'fix(replay): pin generated cargo receipts to admitted toolchain'
          git push origin HEAD:agent/migrate-ggen-v26-8-1-corpus
