name: Patch exact replay report diagnostic

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/migrate-ggen-v26-8-1-corpus'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-ggen-v26-8-1-corpus
          fetch-depth: 0

      - name: Add bounded A/B report fragment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temporary-import-ggen-v26-8-1.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          cmp /tmp/report-a.json migrations/ggen-v26.8.1/verifier-report.json
          cmp /tmp/equivalence-a.json migrations/ggen-v26.8.1/equivalence-report.json
'''
          new = '''          if ! cmp /tmp/report-a.json migrations/ggen-v26.8.1/verifier-report.json; then
            echo '--- report A lines 120-134 ---' >&2
            nl -ba /tmp/report-a.json | sed -n '120,134p' >&2
            echo '--- report B lines 120-134 ---' >&2
            nl -ba migrations/ggen-v26.8.1/verifier-report.json | sed -n '120,134p' >&2
            exit 1
          fi
          cmp /tmp/equivalence-a.json migrations/ggen-v26.8.1/equivalence-report.json
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'PATCH_PRECONDITION_REFUSED count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-replay-report-diagnostic.yml
          git config user.name 'ggen migration diagnostic agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(migration): expose exact replay report fragment'
          git push origin HEAD:agent/migrate-ggen-v26-8-1-corpus
