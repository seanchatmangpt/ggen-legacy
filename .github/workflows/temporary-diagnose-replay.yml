name: Temporary diagnose migration replay

on:
  push:
    branches: [agent/migrate-ggen-v26-8-1-corpus]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-ggen-v26-8-1-corpus
          fetch-depth: 0

      - name: Add bounded structural replay diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temporary-import-ggen-v26-8-1.yml')
          text = path.read_text()
          old = '          cmp /tmp/report-a.json migrations/ggen-v26.8.1/verifier-report.json\n'
          diagnostic = '''          python3 - <<'PYDIFF'
          import json
          from pathlib import Path

          left = json.loads(Path('/tmp/report-a.json').read_text())
          right = json.loads(Path('migrations/ggen-v26.8.1/verifier-report.json').read_text())

          def first_diff(a, b, path='$'):
              if type(a) is not type(b):
                  return path, a, b
              if isinstance(a, dict):
                  keys = sorted(set(a) | set(b))
                  for key in keys:
                      if key not in a or key not in b:
                          return f'{path}.{key}', a.get(key, '<MISSING>'), b.get(key, '<MISSING>')
                      found = first_diff(a[key], b[key], f'{path}.{key}')
                      if found:
                          return found
                  return None
              if isinstance(a, list):
                  if len(a) != len(b):
                      return f'{path}.length', len(a), len(b)
                  for index, (av, bv) in enumerate(zip(a, b)):
                      found = first_diff(av, bv, f'{path}[{index}]')
                      if found:
                          return found
                  return None
              if a != b:
                  return path, a, b
              return None

          found = first_diff(left, right)
          print('FIRST_REPLAY_DIFF=' + json.dumps(found, sort_keys=True, default=str))
          PYDIFF
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'REPLAY_DIAGNOSTIC_PRECONDITION_REFUSED count={count}')
          path.write_text(text.replace(old, diagnostic + old, 1))
          PY
          rm -f .github/workflows/temporary-diagnose-replay.yml
          git config user.name 'ggen migration agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temporary-import-ggen-v26-8-1.yml .github/workflows/temporary-diagnose-replay.yml
          git commit -m 'test(replay): expose first structural report difference'
          git push origin HEAD:agent/migrate-ggen-v26-8-1-corpus
