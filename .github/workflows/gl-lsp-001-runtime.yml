name: GL-LSP-001 Runtime

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"
      - "authority/lsp-contract.json"
      - "scripts/verify_lsp_contract.py"
      - ".github/workflows/gl-lsp-001-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gl-lsp-001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install admitted Rust toolchain
        run: |
          rustup toolchain install nightly-2026-06-22 --profile minimal --component rustfmt,clippy
          rustup default nightly-2026-06-22
          rustc --version --verbose
          cargo --version --verbose

      - name: Verify received contract
        run: python3 scripts/verify_lsp_contract.py --root . --report /tmp/receiver-report.json

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile every target
        run: cargo check --all-targets --locked

      - name: Refuse Clippy warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Execute runtime and stdio tests
        run: cargo test --all-targets --locked -- --test-threads=1

      - name: Preserve receipt summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          report = {
              "schema": "gl-lsp-001-exact-head-runtime/v1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "claim_ceiling": "EXACT_HEAD_RUST_RUNTIME_AND_STDIO_TESTS_ONLY",
          }
          Path("/tmp/gl-lsp-001-workflow-receipt.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, sort_keys=True))
          PY
