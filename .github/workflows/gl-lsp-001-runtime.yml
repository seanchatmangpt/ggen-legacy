name: GL-LSP-001 Runtime

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"
      - "authority/lsp-contract.json"
      - "scripts/verify_lsp_contract.py"
      - "scripts/ci_step_receipt.py"
      - "scripts/tests/test_ci_step_receipt.py"
      - ".github/workflows/gl-lsp-001-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"
      - "authority/lsp-contract.json"
      - "scripts/verify_lsp_contract.py"
      - "scripts/ci_step_receipt.py"
      - "scripts/tests/test_ci_step_receipt.py"
      - ".github/workflows/gl-lsp-001-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gl-lsp-001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      RECEIPT_DIR: evidence/ci/gl-lsp-001
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify receipt laws
        run: python3 -m unittest scripts/tests/test_ci_step_receipt.py

      - name: Initialize exact-head receipt
        run: |
          mkdir -p "$RECEIPT_DIR"
          python3 scripts/ci_step_receipt.py init \
            --report "$RECEIPT_DIR/receipt.json" \
            --schema gl-lsp-001-exact-head-runtime/v2 \
            --head "$EXPECTED_HEAD" \
            --claim-ceiling EXACT_HEAD_RUST_RUNTIME_AND_STDIO_TESTS_ONLY

      - name: Install admitted Rust toolchain
        run: |
          python3 scripts/ci_step_receipt.py run --report "$RECEIPT_DIR/receipt.json" --id rust-toolchain -- \
            bash -lc 'rustup toolchain install nightly-2026-06-22 --profile minimal --component rustfmt,clippy && rustup default nightly-2026-06-22 && rustc --version --verbose && cargo --version --verbose'

      - name: Verify received contract
        run: python3 scripts/ci_step_receipt.py run --report "$RECEIPT_DIR/receipt.json" --id lsp-contract -- python3 scripts/verify_lsp_contract.py --root . --report "$RECEIPT_DIR/receiver-report.json"

      - name: Check formatting
        run: python3 scripts/ci_step_receipt.py run --report "$RECEIPT_DIR/receipt.json" --id cargo-fmt -- cargo fmt --all -- --check

      - name: Compile every target
        run: python3 scripts/ci_step_receipt.py run --report "$RECEIPT_DIR/receipt.json" --id cargo-check -- cargo check --all-targets --locked

      - name: Refuse Clippy warnings
        run: python3 scripts/ci_step_receipt.py run --report "$RECEIPT_DIR/receipt.json" --id cargo-clippy -- cargo clippy --all-targets --locked -- -D warnings

      - name: Execute runtime and stdio tests
        run: python3 scripts/ci_step_receipt.py run --report "$RECEIPT_DIR/receipt.json" --id cargo-test -- cargo test --all-targets --locked -- --test-threads=1

      - name: Finalize exact-head receipt
        if: always()
        run: python3 scripts/ci_step_receipt.py finalize --report "$RECEIPT_DIR/receipt.json"

      - name: Upload exact-head runtime receipt
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: gl-lsp-001-${{ env.EXPECTED_HEAD }}
          path: evidence/ci/gl-lsp-001/
          if-no-files-found: error
          retention-days: 14
