name: Enterprise Architecture Foundry Bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: foundry-bootstrap-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout ggen-legacy exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: ggen-legacy
          fetch-depth: 0

      - name: Checkout ggen manufacturing kernel
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: agent/architecture-foundry-runtime
          path: ggen
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify clean exact-head inputs
        run: |
          test -z "$(git -C ggen status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C ggen-legacy status --porcelain=v1 --untracked-files=all)"

      - name: Verify canonical runtime formatting
        run: cargo fmt --manifest-path ggen/tools/architecture-foundry/Cargo.toml -- --check

      - name: Test runtime against real Git boundaries
        run: cargo test --manifest-path ggen/tools/architecture-foundry/Cargo.toml --all-targets

      - name: Validate work program
        run: |
          cargo run --manifest-path ggen/tools/architecture-foundry/Cargo.toml -- \
            validate-program \
            --program ggen/docs/architecture-foundry/work-program.yaml

      - name: Establish exact-head baseline
        run: |
          cargo run --manifest-path ggen/tools/architecture-foundry/Cargo.toml -- \
            baseline \
            --program ggen/docs/architecture-foundry/work-program.yaml \
            --source ggen \
            --corpus ggen-legacy \
            --out "${RUNNER_TEMP}/foundry-baseline"

      - name: Manufacture bounded corpus checkpoints
        shell: bash
        run: |
          git -C ggen-legacy config user.name "ggen-foundry-manufacturer"
          git -C ggen-legacy config user.email "ggen-foundry-manufacturer@users.noreply.github.com"

          if [[ ! -f ggen-legacy/foundry/foundry-manifest.json ]]; then
            cargo run --manifest-path ggen/tools/architecture-foundry/Cargo.toml -- \
              initialize-corpus \
              --program ggen/docs/architecture-foundry/work-program.yaml \
              --source ggen \
              --corpus ggen-legacy

            git -C ggen-legacy add foundry
            git -C ggen-legacy commit -m "feat(foundry): initialize executable architecture corpus"
          fi

          if [[ ! -f ggen-legacy/foundry/workstreams/A/admission-report.json ]]; then
            cargo run --manifest-path ggen/tools/architecture-foundry/Cargo.toml \
              --bin admit_baseline -- \
              --program ggen/docs/architecture-foundry/work-program.yaml \
              --source ggen \
              --corpus ggen-legacy

            git -C ggen-legacy add foundry
            git -C ggen-legacy commit -m "feat(foundry): admit exact-head baseline workstream"
          fi

          if [[ ! -f ggen-legacy/foundry/workstreams/B/admission-report.json ]]; then
            cargo run --manifest-path ggen/tools/architecture-foundry/Cargo.toml \
              --bin admit_observation -- \
              --program ggen/docs/architecture-foundry/work-program.yaml \
              --source ggen \
              --corpus ggen-legacy \
              --evidence-ref origin/agent/v26.8.1-remaining-observers

            git -C ggen-legacy add foundry
            git -C ggen-legacy commit -m "feat(foundry): admit exhaustive capability observation"
          fi

          git -C ggen-legacy push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Verify committed A-B admission state
        run: |
          test -z "$(git -C ggen-legacy status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("ggen-legacy/foundry/workstreams/state.json").read_text())
          assert state["workstreams"]["A"]["status"] == "ADMITTED", state
          assert state["workstreams"]["B"]["status"] == "ADMITTED", state
          assert state["workstreams"]["C"]["status"] == "READY", state
          for path in [
              "foundry/receipts/initialization.json",
              "foundry/receipts/workstream-A.json",
              "foundry/receipts/workstream-B.json",
              "foundry/workstreams/A/admission-report.json",
              "foundry/workstreams/B/admission-report.json",
              "foundry/catalogs/capability-candidates.json",
              "foundry/evidence/B/legacy-capabilities.ttl",
              "foundry/evidence/B/observer-class-report.md",
          ]:
              assert Path("ggen-legacy", path).is_file(), path
          PY

      - name: Replay committed receipts
        run: |
          cargo run --manifest-path ggen/tools/architecture-foundry/Cargo.toml -- \
            replay \
            --source ggen \
            --corpus ggen-legacy

      - name: Verify corpus state
        run: |
          cargo run --manifest-path ggen/tools/architecture-foundry/Cargo.toml -- \
            verify \
            --program ggen/docs/architecture-foundry/work-program.yaml \
            --source ggen \
            --corpus ggen-legacy

      - name: Verify no post-admission drift
        run: test -z "$(git -C ggen-legacy status --porcelain=v1 --untracked-files=all)"
