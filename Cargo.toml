[package]
name = "ggen-legacy-lsp"
version = "26.8.1"
edition = "2021"
rust-version = "1.82.0"
license = "MIT"
description = "ggen legacy language server implemented on lsp-max"
repository = "https://github.com/seanchatmangpt/ggen-legacy"
publish = false

[[bin]]
name = "ggen-lsp"
path = "src/main.rs"

[lib]
name = "ggen_legacy_lsp"
path = "src/lib.rs"

[dependencies]
lsp-max = { git = "https://github.com/seanchatmangpt/lsp-max", rev = "220d3251e959f6a58ce0311e995b31a85f98240c" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.11"
toml = "0.8"
anyhow = "1"

[dev-dependencies]
serde_json = "1"
