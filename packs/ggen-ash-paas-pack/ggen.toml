[project]
name = "ggen-legacy-ash-paas-consumer"
version = "26.8.27"
description = "Manufacture a provider-neutral Ash/AshR2RML/Reactor PaaS kernel from admitted RDF"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.chatmangpt.com/ontology/legacy-paas#"
imports = []

[ontology.prefixes]
paas = "https://ggen.chatmangpt.com/ontology/legacy-paas#"
schema = "https://schema.org/"
prov = "http://www.w3.org/ns/prov#"
dcat = "http://www.w3.org/ns/dcat#"
dcterms = "http://purl.org/dc/terms/"
odrl = "http://www.w3.org/ns/odrl/2/"
qudt = "http://qudt.org/schema/qudt/"
skos = "http://www.w3.org/2004/02/skos/core#"
sh = "http://www.w3.org/ns/shacl#"
rr = "http://www.w3.org/ns/r2rml#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[validation]
gates = ["gates/invalid-paas-model.rq"]

[generation]
output_dir = "."

[[generation.rules]]
name = "paas-mix-project"
query = { file = "queries/platform.rq" }
template = { file = "templates/mix.exs.tera" }
output_file = "consumer/paas/mix.exs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "paas-runtime"
query = { file = "queries/platform.rq" }
template = { file = "templates/lib/ggen_legacy_paas.ex.tera" }
output_file = "consumer/paas/lib/ggen_legacy_paas.ex"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "paas-runtime-tests"
query = { file = "queries/platform.rq" }
template = { file = "templates/test/ggen_legacy_paas_test.exs.tera" }
output_file = "consumer/paas/test/ggen_legacy_paas_test.exs"
skip_empty = false
mode = "Overwrite"
