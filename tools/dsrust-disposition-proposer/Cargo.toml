[workspace]

[package]
name = "dsrust-disposition-proposer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Real dsrust (DSPy-for-Rust) example: proposes a legacy-capability disposition from real evidence fields, for human/admit_capabilities review -- never auto-admitting. Groq-backed via dsrust's OpenAI-compatible base-URL support."

[[bin]]
name = "propose-disposition"
path = "src/main.rs"

[dependencies]
dsrust = "0.1.0-alpha.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
