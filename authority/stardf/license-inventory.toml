# StarDF license-inventory — conjunct-notice carriage census (W1 lane 6).
#
# Ported from ~/purrdf/license-inventory.toml (upstream rev
# 0da0578306983da851a9073337d57e2e2c41ab3a) per
# stardf/docs/jira/v26.10.31/08-vendoring-plan.md checklist item 5: the
# AND-conjunction licenses (Unicode-3.0, BSD-3-Clause) travel with the
# specific files that carry them. These are the files the vendored tier
# leaves WILL carry; every row is PLANNED — the copy has not executed.
# Path segments use upstream purrdf crate layout; stardf-side directory
# renames (crates/lex → crates/stardf-lex, etc.) are applied at copy time
# without changing license expressions or pins.

[vendor_pin]
upstream = "purrdf"
rev = "0da0578306983da851a9073337d57e2e2c41ab3a"
verified = "git -C ~/purrdf rev-parse HEAD (2026-10-31, per 08-vendoring-plan.md)"

